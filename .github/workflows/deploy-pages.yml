name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: MariaWasNotAvailable/MariaWasNotAvailable.github.io
          ref: main
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: website

      - name: Publish build
        run: |
          mkdir -p website/circuit-web-synth-editor
          rsync -a --delete dist/ website/circuit-web-synth-editor/
          git -C website config user.name github-actions[bot]
          git -C website config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C website add --all -- circuit-web-synth-editor
          if git -C website diff --cached --quiet -- circuit-web-synth-editor; then
            echo "No deployment changes to publish."
          else
            git -C website commit -m "Deploy Circuit Web Synth Editor"
            git -C website push origin HEAD:main
          fi
